services:
  - type: web
    name: vulcan-admin
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: ORGANISER_PASSCODE
        sync: false
      - key: ORGANISER_SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: SITE_URL
        value: https://vulcan-club.vercel.app
      - key: VITE_PUBLIC_SITE_URL
        value: https://vulcan-club.vercel.app

